    <style>
        .dropdown-toggle::after {
            display: none !important;
        }

        .dropdown-menu {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
        }

            .dropdown-menu > a,
            .dropdown-menu > li > a,
            .dropdown-menu > li > .nav-link
            .dropdown-menu > li > .dropdown-item {
                line-height: 2rem;
                font-family: "Montserrat", sans-serif;
                font-weight: 400;
                font-size: 1.0rem;
                color: var(--muted);
            }


                .dropdown-menu > a:hover, .dropdown-menu > li > a:hover, .dropdown-menu > .active > a, .dropdown-menu > .active > a:hover, .dropdown-menu > .active > a:focus {
                    background-color: var(--surface);
                    color: var(--text);
                    -webkit-box-shadow: none;
                    box-shadow: none;
                    background-image: none;
                    text-shadow: none;
                }

        /* ── CSS Custom Properties (Design Tokens) ──────────────────────────────
        All colours are defined here as variables so you only need to change
        them in one place. Reference them anywhere with var(--name).          */
        :root {
            --bg: #0f1117; /* Page background — very dark navy              */
            --surface: #181c27; /* Header / footer background — one step lighter */
            --card: #1f2435; /* Game field & stat pill background              */
            --border: #2c3350; /* Subtle border colour used throughout           */
            --text: #e8eaf6; /* Primary text — soft white                      */
            --muted: #6b728e; /* Secondary / dimmed text                        */
            --accent: #5c6bc0; /* Indigo accent for icons and highlights          */
            /* The six game button colours — swap these to retheme the buttons */
            /*--c1: #ef5350;*/ /* Red    */
            /*--c2: #42a5f5;*/ /* Blue   */
            /*--c3: #66bb6a;*/ /* Green  */
            /*--c4: #ffa726;*/ /* Orange */
            /*--c5: #ab47bc;*/ /* Purple */
            /*--c6: #26c6da;*/ /* Cyan   */

            --maxfieldwidth: 640px;
        }

        /* ── Global Reset ───────────────────────────────────────────────────────
        Ensures all elements include padding/border in their width (border-box)
        and removes browser default margins and padding.                       */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── Page Layout ────────────────────────────────────────────────────────
        height: 100% makes the page fill the full viewport height.
        display: flex + flex-direction: column stacks header / main / footer
        vertically, allowing main to grow and push the footer to the bottom.  */
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ══════════ HEADER ══════════ */

        /* Sticky top bar — uses --surface colour, separated from content by a
        thin border. flex-shrink: 0 prevents it from shrinking when main grows. */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: .7rem 1rem;
            flex-shrink: 0;
        }



            /* Centres the header content and caps it at 520 px wide.
        flex + space-between pushes the title left and stats right.
        flex-wrap: wrap lets them stack on very narrow screens.               */
            header .inner {
                max-width: var(--maxfieldwidth); /*520px;*/
                margin: 0 auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                /*justify-content: center !important;*/
                flex-wrap: wrap;
                gap: .4rem;
            }

        /* Game title text — extra bold with tight letter-spacing for impact.
        flex + gap aligns the icon and text side by side.                     */
        .game-title {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -.02em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: .45rem;
        }

        @media (max-width : 767px) {
            .game-title {
                font-size: 1.05rem;
            }
        }

        /* Icon inside the title inherits the accent colour.                     */
        .game-title i {
            color: var(--accent);
            font-size: 1.1rem;
        }

        /* Wrapper that groups the Level and Score stat pills together.          */
        .stat-group {
            display: flex;
            gap: .75rem;
            align-items: center;
            justify-content: center !important;
        }

        /* Individual stat pill — pill shape via border-radius: 20px.
        Uses --card background and --border outline to match the field.       */
        .stat {
            display: flex;
            align-items: center;
            gap: .32rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px; /* Makes it a rounded pill shape */
            padding: .28rem .7rem;
            font-size: .8rem;
            font-weight: 500;
        }

            /* Small icon inside each stat pill, dimmed with --muted.               */
            .stat i {
                font-size: .75rem;
                color: var(--muted);
            }

        /* The numeric value inside each stat — bold and right-aligned.
        min-width stops the pill from jumping when the number changes width.  */
        .stat-val {
            font-weight: 700;
            color: #fff;
            min-width: 1.6ch;
            text-align: right;
        }

        /* Specific colours for each stat value to distinguish them at a glance. */
        #level-val {
            color: #ffa726;
        }
        /* Orange for level  */
        #score-val {
            color: #66bb6a;
        }
        /* Green  for score  */

        /* ── Message Bar ────────────────────────────────────────────────────────
        Sits below the stat row. min-height reserves space so the layout does
        not jump when the message is empty.                                   */
        .msg-bar {
            max-width: var(--maxfieldwidth); /*520px;*/
            margin: .45rem auto 0;
            min-height: 1.5rem; /* Reserves vertical space even when empty */
            text-align: center;
        }

        /* The message text itself — smaller, dimmed by default.
        Your JS can change the colour to signal success/error/info.           */
        #message {
            font-size: 1rem; /*.82rem;*/
            font-weight: 500;
            letter-spacing: .03em;
            color: var(--muted);
        }

        /* ══════════ MAIN ══════════ */

        /* flex: 1 makes <main> expand to fill all remaining vertical space
        between the header and footer. Inner flex centres the game-wrap.      */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Centres and constrains the game area to 520 px.
        flex-direction: column stacks the field above the button row.         */
        .game-wrap {
            width: 100%;
            max-width: var(--maxfieldwidth); /*520px;*/
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        /* ── Square Game Field ──────────────────────────────────────────────────
        .field-outer is a full-width relative container.
        The ::before pseudo-element with padding-top: 100% is the classic CSS
        intrinsic ratio trick — it forces the container to always be as tall
        as it is wide, giving a perfect square at any screen size.            */
        .field-outer {
            width: 100%;
            position: relative; /* Anchor for the absolutely positioned .game-field */
        }

            /* padding-top: 100% = 100% of the element's own width → perfect square. */
            .field-outer::before {
                content: '';
                display: block;
                padding-top: 100%; /* The intrinsic 1:1 ratio trick */
            }

        /* The actual game field fills its parent completely via inset: 0
        (shorthand for top/right/bottom/left: 0).
        Replace the placeholder content inside here with your game canvas.    */
        .game-field {
            position: absolute;
            inset: 0; /* Fills the .field-outer square exactly */
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: .6rem;
        }

            /* Large icon shown in the placeholder centre — dimmed to match border.  */
            .game-field .placeholder-icon {
                font-size: 3rem;
                color: var(--border);
            }

            /* "GAME FIELD" label under the placeholder icon — small, muted, caps.   */
            .game-field .placeholder-text {
                font-size: .85rem;
                font-weight: 500;
                color: var(--muted);
                letter-spacing: .05em;
                text-transform: uppercase;
            }

        /* ── Color Button Row ───────────────────────────────────────────────────
        CSS Grid with 6 equal columns auto-sizes each button to share the
        available width responsively regardless of screen size.               */
        .btn-row {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6 equal-width columns */
            gap: .5rem;
        }

        /* Base style for every colour button.
        position: relative is required so the ::after hover overlay can be
        positioned inside it. transition animates lift & shadow on hover.     */
        .color-btn {
            height: 44px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: relative; /* Needed for the ::after pseudo-element overlay */
            transition: transform .13s, box-shadow .13s;
            box-shadow: 0 3px 8px rgba(0,0,0,.4);
            outline: none;
        }

            /* Invisible white overlay that fades in on hover to lighten the button.
        Using ::after keeps it non-interactive and self-contained.            */
            .color-btn::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 8px;
                background: rgba(255,255,255,.13); /* Subtle white sheen */
                opacity: 0;
                transition: opacity .15s;
            }

            /* Show the white sheen overlay when hovering.                           */
            .color-btn:hover::after {
                opacity: 1;
            }

            /* Lift the button upward and deepen its shadow on hover.               */
            .color-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 7px 18px rgba(0,0,0,.45);
            }

            /* Snap the button back to its resting position on click (active state). */
            .color-btn:active {
                transform: translateY(0);
            }

        /* Each button's background colour is set via its data-color attribute.
        Change --c1 through --c6 in :root above to retheme all buttons.      */
        /*  .color-btn[data-color="c1"] {
                background: var(--c1);

            .color-btn[data-color="c2"] {

            }

            .color-btn[data-color="c3"] {
                background: var(--c3);
            }

            .color-btn[data-color="c4"] {
                background: var(--c4);
            }

            .color-btn[data-color="c5"] {
                background: var(--c5);
            }

            .color-btn[data-color="c6"] {
                background: var(--c6);
            }*/

        /* ══════════ FOOTER ══════════ */

        /* Mirrors the header style — same --surface background and matching
        border on the opposite side. flex-shrink: 0 keeps it pinned to the
        bottom when main expands to fill vertical space.                      */
        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: .6rem 1rem;
            text-align: center;
            flex-shrink: 0;
        }

            /* Small, dimmed copyright text.                                         */
            footer p {
                font-size: .73rem;
                color: var(--muted);
                margin: 0;
            }

            /* Tiny side margins on inline icons inside the footer text.             */
            footer i {
                margin: 0 .2rem;
            }



        .wave-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: rgba(0, 255, 0, 0.5); /* Green wave */
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0) rotate(0deg);
            pointer-events: none;
            z-index: 9999;
        }

        .wave-active {
            animation: waveEffect 0.8s ease-in-out;
        }

        @keyframes waveEffect {
            0% {
                transform: /*translate(-50%, -50%) */ scale(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: /*translate(-50%, -50%) */ scale(10) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
